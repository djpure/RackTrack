<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>RackTrack</title></head><body><header class="top"><div><h1>RackTrack</h1><span>Mobile Rack Documentation</span></div><button id="newRack" class="primary">+ Rack</button></header><main><section class="card hero"><div><small>AKTIVES PROJEKT</small><h2 id="title">Rack 01</h2><p id="meta">42U · 19&quot; · Front</p></div><div class="heroBtns"><label class="btn">📷 Foto<input id="photo" type="file" accept="image/*" capture="environment" hidden></label><button id="analyze">✨ Analysieren</button></div></section><nav><button class="tab active" data-id="rack">Rack</button><button class="tab" data-id="devices">Geräte</button><button class="tab" data-id="photos">Fotos</button><button class="tab" data-id="settings">Projekt</button></nav><section id="rack" class="panel active"><div class="card tools"><label>Rackgröße<select id="units"><option>12</option><option>18</option><option>24</option><option>27</option><option>32</option><option selected>42</option><option>45</option><option>47</option></select></label><button id="addDevice" class="primary">+ Gerät</button></div><div id="rackView" class="rack"></div></section><section id="devices" class="panel"><div class="card"><h3>Geräte</h3><div id="deviceList"></div></div></section><section id="photos" class="panel"><div class="card"><h3>Fotos</h3><div id="photoGrid" class="photos"></div></div></section><section id="settings" class="panel"><div class="card form"><label>Projektname<input id="projectName"></label><label>Standort<input id="location" placeholder="Technikraum"></label><label>Rack-ID<input id="rackId" placeholder="AV-R01"></label><button id="saveProject" class="primary">Speichern</button><button id="exportProject">JSON exportieren</button></div></section></main><dialog id="dialog"><form method="dialog" id="deviceForm"><h3>Gerät hinzufügen</h3><label>Name<input id="dName" required placeholder="Cisco C9300"></label><label>Start-U<input id="dU" type="number" min="1" value="1" required></label><label>Höhe (U)<input id="dH" type="number" min="1" max="10" value="1" required></label><label>Hersteller<input id="dVendor"></label><label>Modell<input id="dModel"></label><div class="dialogBtns"><button value="cancel">Abbrechen</button><button value="ok" class="primary">Hinzufügen</button></div></form></dialog><script src="app.js"></script></body></html>
